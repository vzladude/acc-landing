AWSTemplateFormatVersion: '2010-09-09'
Description: ACC static website - private S3, CloudFront OAC and a dedicated WAF for the Free pricing plan.
Parameters:
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Default: Z05695902OJ8GCHX96L36
    Description: Existing Route 53 zone for inversionesacc.com.
  ActivateDns:
    Type: String
    Default: 'false'
    AllowedValues: ['false', 'true']
    Description: Point public traffic to CloudFront only after pre-cutover verification.
Conditions:
  PublishDns: !Equals [!Ref ActivateDns, 'true']
Resources:
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: inversionesacc.com
      SubjectAlternativeNames: [www.inversionesacc.com]
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: inversionesacc.com
          HostedZoneId: !Ref HostedZoneId
        - DomainName: www.inversionesacc.com
          HostedZoneId: !Ref HostedZoneId
      Tags:
        - Key: Project
          Value: acc-landing
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub acc-landing-production-${AWS::AccountId}
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Project
          Value: acc-landing
        - Key: Environment
          Value: production
  OriginAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: acc-landing-production
        Description: Signed access to the private ACC website bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  SiteFirewall:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: acc-landing-production
      Scope: CLOUDFRONT
      Description: Dedicated to the ACC CloudFront Free pricing plan
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        CloudWatchMetricsEnabled: false
        SampledRequestsEnabled: false
        MetricName: acc-landing-production
      Rules:
        - Name: LimitExcessiveRequests
          Priority: 0
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              AggregateKeyType: IP
              Limit: 2000
              EvaluationWindowSec: 300
          VisibilityConfig:
            CloudWatchMetricsEnabled: false
            SampledRequestsEnabled: false
            MetricName: acc-excessive-requests
      Tags:
        - Key: Project
          Value: acc-landing
  CanonicalRedirect:
    Type: AWS::CloudFront::Function
    Properties:
      Name: acc-production-canonical-redirect
      AutoPublish: true
      FunctionConfig:
        Comment: Redirect temporary hosts and index.html to the official ACC URL
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var host = request.headers.host.value;
          var canonicalHost = 'inversionesacc.com';
          if (host === canonicalHost && request.uri !== '/index.html') return request;
          var uri = request.uri === '/index.html' ? '/' : request.uri;
          var parts = [];
          // CloudFront supplies URL-encoded query components; do not encode them twice.
          var query = request.querystring;
          Object.keys(query).forEach(function (key) {
            var values = query[key].multiValue || [query[key]];
            values.forEach(function (item) { parts.push(key + '=' + item.value); });
          });
          return {
            statusCode: 301,
            statusDescription: 'Moved Permanently',
            headers: {
              location: { value: 'https://' + canonicalHost + uri + (parts.length ? '?' + parts.join('&') : '') },
              'cache-control': { value: 'public, max-age=300' }
            }
          };
        }
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: ACC production landing - CloudFront Free plan
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_All
        WebACLId: !GetAtt SiteFirewall.Arn
        Aliases: [inversionesacc.com, www.inversionesacc.com]
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          MinimumProtocolVersion: TLSv1.2_2021
          SslSupportMethod: sni-only
        Origins:
          - Id: acc-private-s3
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref OriginAccess
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: acc-private-s3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt CanonicalRedirect.FunctionMetadata.FunctionARN
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
      Tags:
        - Key: Project
          Value: acc-landing
        - Key: Environment
          Value: production
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
          - Sid: RequireTLS
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt SiteBucket.Arn
              - !Sub '${SiteBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false
  DomainRecords:
    Type: AWS::Route53::RecordSetGroup
    Condition: PublishDns
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - Name: inversionesacc.com
          Type: A
          AliasTarget:
            HostedZoneId: Z2FDTNDATAQYW2
            DNSName: !GetAtt Distribution.DomainName
            EvaluateTargetHealth: false
        - Name: inversionesacc.com
          Type: AAAA
          AliasTarget:
            HostedZoneId: Z2FDTNDATAQYW2
            DNSName: !GetAtt Distribution.DomainName
            EvaluateTargetHealth: false
        - Name: www.inversionesacc.com
          Type: A
          AliasTarget:
            HostedZoneId: Z2FDTNDATAQYW2
            DNSName: !GetAtt Distribution.DomainName
            EvaluateTargetHealth: false
        - Name: www.inversionesacc.com
          Type: AAAA
          AliasTarget:
            HostedZoneId: Z2FDTNDATAQYW2
            DNSName: !GetAtt Distribution.DomainName
            EvaluateTargetHealth: false
Outputs:
  CertificateArn:
    Value: !Ref Certificate
  HostedZoneId:
    Value: !Ref HostedZoneId
  SiteURL:
    Value: https://inversionesacc.com/
  Bucket:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
  DistributionArn:
    Value: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
  DistributionDomain:
    Value: !GetAtt Distribution.DomainName
  WebACLArn:
    Value: !GetAtt SiteFirewall.Arn
  URL:
    Value: !Sub 'https://${Distribution.DomainName}/'
